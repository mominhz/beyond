<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f8f8f8;
            color: #333;
            padding-top: 80px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background: #fff;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .navbar a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            margin: 0 15px;
            font-weight: 600;
        }
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 50px 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-container h2 {
            font-size: 2rem;
            margin-bottom: 30px;
        }
        .input-field {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .button {
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 700; /* Increased weight for the button font */
            transition: 0.3s ease;
            margin-top: 20px;
        }
        .button:hover {
            transform: scale(1.1);
        }
        .sign-up {
            background-color: #007AFF;
            color: white;
        }
        .sign-up:hover {
            background-color: #0051a2;
        }
        footer {
            padding: 20px;
            text-align: center;
            background: #fff;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><a href="index.html">Beyond</a></div>
    </div>

    <div class="form-container">
        <h2>Create Your Account</h2>
        <form action="your-action-url" method="POST">
            <!-- Add Name Input Field -->
            <input type="text" class="input-field" name="name" placeholder="Enter your name" required>

            <input type="email" class="input-field" name="email" placeholder="Enter your email" required>

            <input type="password" class="input-field" name="password" placeholder="Create a password" required>

            <button type="submit" class="button sign-up">Create Account</button>
        </form>
    </div>

    <footer>
        <p>© 2025 Beyond. All Rights Reserved.</p>
    </footer>

</body>
</html>
